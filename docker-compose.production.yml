version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fathul_bari_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: fathul_bari_prod
      POSTGRES_USER: fathul_prod
      POSTGRES_PASSWORD: fathul_secure_prod_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fathul_prod -d fathul_bari_prod"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fathul_bari_prod_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: fathul_bari_prod_backend
    restart: always
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://fathul_prod:fathul_secure_prod_password_2026@postgres:5432/fathul_bari_prod
      - REDIS_URL=redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: fathul_bari_prod_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1
    expose:
      - "3000"
    depends_on:
      - backend

  reverse-proxy:
    image: nginx:alpine
    container_name: fathul_bari_prod_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_prod_data:
