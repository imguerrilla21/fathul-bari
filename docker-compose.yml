version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fathul_bari_postgres
    restart: always
    environment:
      POSTGRES_DB: fathul_bari
      POSTGRES_USER: fathul_user
      POSTGRES_PASSWORD: fathul_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fathul_bari_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: fathul_bari_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://fathul_user:fathul_password_2026@postgres:5432/fathul_bari
      - REDIS_URL=redis://redis:6379/0
      - AHMAD_SANUSI_API_URL=https://api.hadith.sutanlab.id/books
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: fathul_bari_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - api

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: fathul_bari_worker
    restart: always
    command: python -m app.services.workers.background_worker
    environment:
      - DATABASE_URL=postgresql://fathul_user:fathul_password_2026@postgres:5432/fathul_bari
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
